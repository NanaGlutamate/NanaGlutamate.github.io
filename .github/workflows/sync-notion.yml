name: Sync Notion Backup

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest NotionBackup
        run: |
          git submodule update --remote NotionBackup
          cd NotionBackup
          echo "NEW_HEAD=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Commit and push if updated
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add NotionBackup
            git commit -m "auto: sync NotionBackup to $NEW_HEAD"
            git push
          else
            echo "No updates to NotionBackup."
          fi
